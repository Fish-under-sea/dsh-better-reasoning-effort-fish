# 发布到 npm（tag 触发）。
#
# 走 npm 的 Trusted Publishing（OIDC）：无需在仓库里存 NPM_TOKEN，但**必须**
# 先在 npm 网页上为本包配置一次发布者 —— 包 Settings → Trusted Publisher →
# GitHub Actions，填本仓库名与 workflow 文件名 `publish.yml`。首次发布（包名还
# 不存在时）请在本机执行：`npm publish --access public --ignore-scripts`。
#
# 本机发布成功后，同一个版本仍会随 tag 推送触发本 workflow；下面的 registry
# 预检会让它跳过重复发布并保持绿色，而不是以 E403 失败。
#
# 发布前必须打 tag：`git tag v0.5.3 && git push origin v0.5.3`。

name: Publish Package

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 串行化，避免较早的并发运行最后结束而把 dist-tag 往回推。
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check whether this version is already on npm
        id: registry
        # 版本仍在 registry 上时跳过发布：首次发布由本机完成，tag 推送不应因此变红。
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${NAME}@${VERSION} is already published; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.registry.outputs.exists != 'true'
        # --ignore-scripts：lib/ 已由上一步构建好，不必再跑 prepare。
        run: npm publish --access public --ignore-scripts
